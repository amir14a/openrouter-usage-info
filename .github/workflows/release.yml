name: Release index.html

# Publishes index.html as a release asset on every push to main.
#
# The version is read from the VERSION file at the repo root. Bump that file
# in a commit to cut a new release; commits that leave it unchanged are a
# no-op, so ordinary pushes to main do not fail.
#
# Note: GitHub does not fire workflows for pushes made with the default
# GITHUB_TOKEN. This workflow only reads VERSION, so it never commits back
# and that limitation does not apply here.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required to create releases and upload assets.
permissions:
  contents: write

concurrency:
  # Serialize releases so two near-simultaneous pushes cannot race on the
  # same version tag.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          if [ ! -f VERSION ]; then
            echo "::error::VERSION file not found at the repository root."
            exit 1
          fi

          # Take the first line, strip whitespace, and tolerate a leading "v".
          version="$(head -n1 VERSION | tr -d '[:space:]')"
          version="${version#v}"

          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be a semantic version like 1.2.3 (got: '$version')."
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Check whether this release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to do. Bump VERSION to publish again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG does not exist yet; it will be created."
          fi

      - name: Verify index.html is present
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          if [ ! -f index.html ]; then
            echo "::error::index.html not found at the repository root."
            exit 1
          fi
          ls -l index.html

      - name: Create the release and attach index.html
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          gh release create "$TAG" index.html \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "OpenRouter Usage Info \`$VERSION\`.

          A single-file OpenRouter usage viewer. Download **index.html** and open it in any browser — no install, no build step, no dependencies.

          Your API key is sent only to \`openrouter.ai\` and is held in that tab's \`sessionStorage\`; it is never written to disk.

          - Live page: https://amir14a.github.io/openrouter-usage-info/
          - Source: https://github.com/$GITHUB_REPOSITORY
          - Commit: $GITHUB_SHA"

      - name: Summary
        run: |
          {
            if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
              echo "### Skipped"
              echo
              echo "Release \`${{ steps.version.outputs.tag }}\` already exists."
              echo "Bump \`VERSION\` to publish a new release."
            else
              echo "### Released \`${{ steps.version.outputs.tag }}\`"
              echo
              echo "Attached \`index.html\` to a new release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
